  if (G.combo >= 3) { floater(P.x, P.y - 30, 'KOMBO X' + G.combo, '#ff7ab8', 1, 1.1); if (G.combo === 3) Zyn.say(pick(LINES.combo), 0); }
  if (G.combo >= 5) unlock('kombo');
  const [g0, g1] = e.d.gold;
  dropCoins(e.x, e.y, Math.max(1, Math.round(randi(g0, g1) * (1 + 0.15 * (G.floor - 1)) * P.goldMul)));
  if (e.type === 'boss' || chance(0.07 + P.luck * 0.02)) dropPotion(e.x, e.y);
  giveXP(Math.round(e.d.xp * (1 + 0.1 * (G.floor - 1))));
  addViewers((10 + e.d.xp * 2) * G.combo, true);
  if (P.lifeOnKill) healPlayer(P.lifeOnKill, true);
  puff(e.x, e.y - 6, PUFF_COL[e.type] || PUFF_COL.rat, e.type === 'boss' ? 40 : 14);
  Sfx.play('kill');
  G.hitstop = Math.max(G.hitstop, 0.03);
  unlock('ersttaeter');
  if ((G.run.by.rat || 0) >= 15) unlock('kammer');
  if ((G.run.by.slime || 0) >= 10) unlock('glibber');
  if (e.type === 'skel') unlock('paragraf');
  if (e.type === 'mimic') unlock('mimikry');
  if (e.type === 'boss') bossDefeated(e);
}

// ---------- Geschosse, Beute, Truhen ----------
function updateShots(dt) {
  for (const s of G.shots) {
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > s.life || solidT((s.x / TS) | 0, (s.y / TS) | 0)) { s.dead = true; sparks(s.x, s.y, 4, '#c8e05a'); continue; }
    if (Math.abs(s.x - P.x) < 6 && Math.abs(s.y - (P.y - 4)) < 7) { s.dead = true; hurtPlayer(s.dmg, s.x - s.vx, s.y - s.vy); sparks(s.x, s.y, 6, '#c8e05a'); }
  }
  G.shots = G.shots.filter((s) => !s.dead);
}
function updateRings(dt) { for (const r of G.rings) r.t += dt; G.rings = G.rings.filter((r) => r.t < r.dur); }

function spawnCoin(x, y, v) {
  const a = Math.random() * TAU, s = rand(20, 55);
  G.pickups.push({ kind: 'coin', v, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, z: 2, vz: rand(60, 100), t: 0, hw: 2, hh: 2 });
}
function dropCoins(x, y, n) {
  let left = n, cnt = 0;
  while (left > 0 && cnt < 10) { const v = left >= 25 ? 10 : left >= 8 ? 5 : 1; left -= v; cnt++; spawnCoin(x, y, v); }
  if (left > 0) spawnCoin(x, y, left);
}
function dropPotion(x, y) {
  const a = Math.random() * TAU;
  G.pickups.push({ kind: 'potion', x, y, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, z: 2, vz: 90, t: 0, hw: 3, hh: 3 });
}
function updatePickups(dt) {
  for (const c of G.pickups) {
    c.t += dt;
    if (c.kind === 'crate') {
      if (c.z > 0) { c.z = Math.max(0, c.z - 46 * dt); if (c.z === 0) { puff(c.x, c.y, ['#6b5a7d', '#8b8ba3'], 10); Sfx.play('hit'); } continue; }
      if (Math.abs(P.x - c.x) < 11 && Math.abs(P.y - c.y) < 11) { openCrate(c); c.dead = true; }
      continue;
    }
    if (c.vz || c.z > 0) {
      c.z += c.vz * dt; c.vz -= 260 * dt;
      if (c.z <= 0) { c.z = 0; c.vz = -c.vz * 0.4; if (Math.abs(c.vz) < 25) c.vz = 0; }
    }
    if (c.vx || c.vy) {
      moveBox(c, c.vx * dt, c.vy * dt);
      const f = Math.pow(0.03, dt); c.vx *= f; c.vy *= f;
      if (Math.abs(c.vx) + Math.abs(c.vy) < 2) c.vx = c.vy = 0;
    }
    const dx = P.x - c.x, dy = P.y - c.y, d = Math.hypot(dx, dy) || 0.01;
    if (c.t > 0.35 && d < P.magnet) { const s = 110 + (P.magnet - d) * 5; c.x += (dx / d) * s * dt; c.y += (dy / d) * s * dt; }
    if (d < 7 && c.t > 0.25) { if (collect(c)) c.dead = true; }
  }
  G.pickups = G.pickups.filter((c) => !c.dead);
}
function collect(c) {
  if (c.kind === 'coin') {
    addGold(c.v);
    G.goldAcc += c.v; G.goldAccT = 0.35;
    Sfx.play('coin');
    return true;
  }
  if (c.kind === 'potion') {
    if (P.potions >= 9) return false;
    P.potions++;
    floater(P.x, P.y - 22, '+TRANK', '#ff7a85');
    Sfx.play('coin'); addViewers(4, true);
    return true;
  }
  return false;
}
function openChest(c) {
  c.open = true;
  G.run.chests++;
  dropCoins(c.x, c.y, Math.round(randi(10, 22) * (1 + 0.25 * (G.floor - 1)) * P.goldMul));
  if (chance(0.3)) dropPotion(c.x, c.y);
  if (chance(0.12 + 0.06 * P.luck)) { P.boxes.push(0); floater(c.x, c.y - 22, 'BEUTEKISTE!', '#ffd23f'); }
  Sfx.play('box'); addViewers(25, true);
  sparks(c.x, c.y - 6, 12, '#ffd23f');
  if (G.run.chests >= 5) unlock('schatz');
  Zyn.say(pick(LINES.chest), 0);
}
function dropCrate() {
  let x = P.x, y = P.y + 20;
  for (let k = 0; k < 40; k++) {
    const a = Math.random() * TAU, r = rand(26, 52);
    const nx = P.x + Math.cos(a) * r, ny = P.y + Math.sin(a) * r;
    if (!boxHit(nx, ny, 7, 6) && los(P.x, P.y, nx, ny)) { x = nx; y = ny; break; }
  }
  if (boxHit(x, y, 6, 5)) { x = P.x; y = P.y; }
  G.pickups.push({ kind: 'crate', x, y, z: 90, t: 0, sponsor: pick(SPONSORS), hw: 6, hh: 5 });
  floater(P.x, P.y - 30, 'SPONSOR!', '#ffd23f', 1, 1.2);
  Sfx.play('sponsor');
}
function openCrate(c) {
  const s = c.sponsor, roll = Math.random();
  let txt;
  if (roll < 0.34) { P.potions = Math.min(9, P.potions + 1); txt = '+1 TRANK'; }
  else if (roll < 0.6) { const g = Math.round(randi(15, 35) * (1 + 0.3 * (G.floor - 1))); addGold(g); txt = '+' + g + ' GOLD'; }
  else if (roll < 0.78) { G.timeLeft += 20; txt = '+20 SEK'; }
  else { P.boxes.push(G.floor >= 4 && chance(0.4) ? 1 : 0); txt = 'BEUTEKISTE'; }
  floater(c.x, c.y - 24, txt, '#ffd23f', 1, 1.3);
  sparks(c.x, c.y - 8, 14, '#ffd23f');
  Zyn.say(fill(LINES.sponsor, { s: s.name, slogan: s.slogan }), 1);
  G.run.sponsor++;
  if (G.run.sponsor >= 3) unlock('sponsor');
  Sfx.play('box'); addViewers(80, true);
}

function stepFx(dt) {
  for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  G.parts = G.parts.filter((p) => p.t < p.dur);
  for (const f of G.floaters) f.t += dt;
  G.floaters = G.floaters.filter((f) => f.t < f.dur);
  for (const s of G.slashes) s.t += dt;
  G.slashes = G.slashes.filter((s) => s.t < s.dur);
  G.shake = Math.max(0, G.shake - dt * 18);
  G.flash = Math.max(0, G.flash - dt * 2.5);
}

// ---------- Spielzustand & Ablauf ----------
const G = {
  state: 'title', time: 0, floor: 1, enemies: [], shots: [], pickups: [], parts: [], floaters: [], slashes: [], rings: [],
  timeLeft: 0, timeMax: 0, sealed: false, hitstop: 0, shake: 0, flash: 0,
  viewers: 120, vShow: 120, viewBase: 100, lastAction: 0, sponsorIdx: 0, pendingCrates: 0, combo: 0, comboT: 0, stillT: 0,
  goldAcc: 0, goldAccT: 0, run: null, fl: null, achieved: new Set(), seenTypes: new Set(), perkQueue: [], perkDelay: 0,
  offers: null, summary: null, boss: null, bossSeen: false, over: null, newAch: [],
};
let P = null;
const META = Object.assign({ best: 0, bestViewers: 0, runs: 0, ach: {} }, store.get('tg.meta', {}));
function saveMeta() { store.set('tg.meta', META); }

function newRun() {
  P = newPlayer();
  G.run = { kills: 0, by: {}, chests: 0, boxes: 0, potions: 0, gold: 0, sponsor: 0, dist: 0, maxCombo: 0, maxViewers: 120 };
  G.achieved = new Set(); G.seenTypes = new Set(); G.perkQueue = [];
  G.viewers = G.vShow = 120; G.sponsorIdx = 0; G.pendingCrates = 0;
  META.runs++; saveMeta();
  UI.clear();
  startFloor(1);
}

function startFloor(n) {
  G.floor = n;
  M = genMap(n);
  prerender(M);
  G.enemies = []; G.shots = []; G.pickups = []; G.parts = []; G.floaters = []; G.slashes = []; G.rings = [];
  G.boss = null; G.bossSeen = false; G.newAch = [];
  P.x = M.start.cx * TS + 8; P.y = M.start.cy * TS + 8; P.tx = P.ty = -1;
  P.inv = 1.2; P.kx = P.ky = 0; P.atkCd = 0;
  populate(n);
  G.timeMax = G.timeLeft = Math.min(140 + 12 * (n - 1) + (M.boss ? 30 : 0) + P.timeBonus + P.nextTime, 360);
  P.nextTime = 0;
  G.sealed = M.boss;
  G.viewBase = 90 * n;
  G.lastAction = G.time; G.stillT = 0; G.combo = 0; G.comboT = 0;
  G.fl = { kills: 0, dmg: 0, gold: 0, low: false, t30: false, t10: false, sealedT: -99, alarmT: 0 };
  V.cx = P.x - V.w / 2; V.cy = P.y - V.h / 2;
  Input.reset();
  G.state = 'play';
  UI.clear();
  UI.hud(true);
  $('#fade').classList.remove('on');
  if (n === 1) { Zyn.say(LINES.floor1, 2); if (META.runs <= 3) showHints(); }
  else if (M.boss) Zyn.say(fill(pick(LINES.boss), { b: G.boss.name }), 2);
  else Zyn.say(fill(pick(LINES.floor), { n }), 2);
  if (n >= 5) unlock('kellerkind');
  if (n >= 10) unlock('tief');
  saveRun();
  for (; G.pendingCrates > 0; G.pendingCrates--) dropCrate();
}

function populate(n) {
  const rooms = M.rooms.filter((r) => r !== M.start && !(M.boss && r === M.goal));
  if (!rooms.length) rooms.push(M.goal);
  const used = new Set([M.stairs.ty * M.W + M.stairs.tx]);
  const freeTile = (r) => {
    for (let k = 0; k < 24; k++) {
      const tx = randi(r.x + 1, r.x + r.w - 2), ty = randi(r.y + 1, r.y + r.h - 2), i = ty * M.W + tx;
      if (used.has(i) || M.tiles[i] !== T_FLOOR) continue;
      used.add(i);
      return { tx, ty };
    }
    return null;
  };
  const nc = randi(1, 2) + (n >= 3 ? 1 : 0) + (P.luck > 0 && chance(0.5) ? 1 : 0);
  for (let i = 0; i < nc; i++) {
    const p = freeTile(pick(rooms));
    if (!p) continue;
    if (n >= 3 && chance(0.22)) spawnEnemy('mimic', p.tx * TS + 8, p.ty * TS + 8);
    else M.chests.push({ tx: p.tx, ty: p.ty, x: p.tx * TS + 8, y: p.ty * TS + 8, open: false });
  }
  const pool = Object.keys(ENEMY).filter((k) => ENEMY[k].w > 0 && ENEMY[k].min <= n);
  const total = Math.min(5 + n * 2, 30);
  for (let i = 0, guard = 0; i < total && guard < 500; guard++) {
    const p = freeTile(pick(rooms));
    if (!p) continue;
    const x = p.tx * TS + 8, y = p.ty * TS + 8;
    if (Math.hypot(x - P.x, y - P.y) < 7 * TS) continue;
    spawnEnemy(wpick(pool, (k) => ENEMY[k].w * (k === 'rat' ? Math.max(0.35, 1 - n * 0.08) : 1)), x, y);
    i++;
  }
  if (M.boss) {
    const idx = Math.max(0, ((n / 3) | 0) - 1), v = BOSS_VAR[idx % BOSS_VAR.length];
    const r = M.goal;
    const e = spawnEnemy('boss', r.cx * TS + 8, (r.cy - 2) * TS + 8, { hpMul: 1 + idx * 0.7 });
    e.name = v.name; e.spr = v.spr;
    G.boss = e;
  }
}

// ---------- Spielschritt ----------
function step(dt) {
  if (G.hitstop > 0) { G.hitstop -= dt; stepFx(dt * 0.25); return; }
  G.time += dt;
  G.timeLeft -= dt;
  const tl = G.timeLeft;
  if (tl <= 30 && !G.fl.t30) { G.fl.t30 = true; Zyn.say(pick(LINES.time30), 2); }
  if (tl <= 10 && !G.fl.t10) { G.fl.t10 = true; Zyn.say(pick(LINES.time10), 2); }
  if (tl <= 10) { G.fl.alarmT -= dt; if (G.fl.alarmT <= 0) { G.fl.alarmT = 1; Sfx.play('alarm'); } }
  if (tl <= 30) {
    G.shake = Math.max(G.shake, tl < 10 ? 1.6 : 0.7);
    if (chance(dt * (tl < 10 ? 14 : 5)) && G.parts.length < 300) {
      G.parts.push({ x: V.cx + rand(0, V.w), y: V.cy + rand(-10, V.h * 0.6), vx: 0, vy: rand(20, 40), t: 0, dur: rand(0.6, 1.2), col: pick(['#6b5a7d', '#8b8ba3', '#4b3e48']), s: chance(0.3) ? 2 : 1, g: 120 });
    }
  }
  if (tl <= 0) { G.timeLeft = 0; gameOver('collapse'); return; }
  updatePlayer(dt);
  if (G.state !== 'play') return;
  updateEnemies(dt);
  updateShots(dt);
  updatePickups(dt);
  updateRings(dt);
  stepFx(dt);
  if (G.hintT > 0) {
    G.hintT -= dt;
    if (P.moving) G.hintMoved = true;
    if (Input.attack) G.hintAtk = true;
    if (G.hintT <= 0 || (G.hintMoved && G.hintAtk)) hideHints();
  }
  // Show-Mechanik
  G.comboT -= dt;
  if (G.comboT <= 0) G.combo = 0;
  if (G.goldAccT > 0) { G.goldAccT -= dt; if (G.goldAccT <= 0 && G.goldAcc) { floater(P.x, P.y - 24, '+' + G.goldAcc + ' GOLD', '#ffd23f'); G.goldAcc = 0; } }
  const idle = G.time - G.lastAction;
  if (idle > 7) G.viewers = Math.max(G.viewBase, G.viewers * (1 - (P.moving ? 0.015 : 0.05) * dt));
  if (!P.moving) {
    G.stillT += dt;
    if (G.stillT > 6) Zyn.say(pick(LINES.idle), 0);
    if (G.stillT > 10) unlock('standbild');
  } else G.stillT = 0;
  if (G.perkQueue.length) { G.perkDelay -= dt; if (G.perkDelay <= 0 && G.state === 'play') showPerk('play'); }
}

// ---------- Zuschauer, Gold, Erfahrung ----------
function addViewers(n, action) {
  if (action) G.lastAction = G.time;
  G.viewers += n * P.viewMul * (1 + 0.35 * (G.floor - 1));
  trackViewers();
}
function sponsorAt(i) {
  const T = [700, 1800, 3500, 6000, 9500, 14000, 20000, 28000, 38000, 50000];
  return i < T.length ? T[i] : Math.round(T[T.length - 1] * Math.pow(1.3, i - T.length + 1));
}
function trackViewers() {
  if (G.viewers > G.run.maxViewers) G.run.maxViewers = G.viewers;
  if (G.viewers >= 10000) unlock('quote');
  while (G.viewers >= sponsorAt(G.sponsorIdx)) {
    G.sponsorIdx++;
    if (G.state === 'play') dropCrate(); else G.pendingCrates++;
  }
}
function addGold(v) {
  P.gold += v; G.run.gold += v;
  if (G.fl) G.fl.gold += v;
  if (G.run.gold >= 300) unlock('goldesel');
}
function giveXP(n) {
  P.xp += n;
  while (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.level++;
    P.xpNext = Math.round(P.xpNext * 1.42 + 5);
    P.maxHp += 4;
    healPlayer(Math.round(P.maxHp * 0.25), false);
    G.perkQueue.push('level');
    G.perkDelay = 0.6;
    floater(P.x, P.y - 34, 'LEVEL UP!', '#7fe0ff', 1, 1.4);
    sparks(P.x, P.y - 8, 16, '#7fe0ff');
    Sfx.play('levelup');
  }
}

// ---------- Erfolge ----------
function unlock(id) {
  if (!G.run || G.achieved.has(id)) return;
  const a = ACH_BY_ID[id];
  if (!a) return;
  G.achieved.add(id);
  META.ach[id] = 1; saveMeta();
  P.boxes.push(a.tier);
  if (G.state === 'play') {
    toast(BOXI[a.tier], 'Erfolg freigeschaltet', a.name, '+ ' + TIER[a.tier] + '-Kiste');
    Zyn.say(a.line, 1);
  } else G.newAch.push(a);
  G.viewers += 250 * P.viewMul * (1 + 0.35 * (G.floor - 1));
  G.lastAction = G.time;
  trackViewers();
  Sfx.play('ach');
}

// ---------- Boss, Treppe, Ende ----------
function bossDefeated(e) {
  G.sealed = false;
  P.boxes.push(2);
  G.viewers += 3000; trackViewers();
  G.shake = Math.max(G.shake, 8);
  unlock('koenig');
  Zyn.say(LINES.bossDead, 2);
  floater(M.stairs.x, M.stairs.y - 18, 'OFFEN!', '#8be35f', 1, 2);
}
function onStairs() {
  if (G.sealed) {
    if (G.time - G.fl.sealedT > 5) {
      G.fl.sealedT = G.time;
      Zyn.say(fill(pick(LINES.sealed), { b: G.boss ? G.boss.name : 'der Boss' }), 1);
      floater(M.stairs.x, M.stairs.y - 16, 'VERSIEGELT', '#ff4d5a');
    }
    return;
  }
  descend();
}
function descend() {
  G.state = 'trans';
  Input.reset();
  Sfx.play('stairs');
  const tl = G.timeLeft;
  if (G.fl.dmg === 0) unlock('kratzer');
  if (tl < 10) unlock('treppenwitz');
  if (tl > 90) unlock('frueh');
  if (G.fl.kills === 0) unlock('pazifist');
  const bonus = Math.round(120 * G.floor + tl * 5);
  G.viewers += bonus; trackViewers();
  G.summary = { floor: G.floor, time: tl, kills: G.fl.kills, gold: G.fl.gold, bonus };
  Zyn.say(pick(LINES.stairs), 2);
  $('#fade').classList.add('on');
  setTimeout(() => {
    if (G.state !== 'trans') return;
    G.offers = makeOffers();
    showShop();
  }, 750);
}
function nextFloor() {
  G.summary = null;
  startFloor(G.floor + 1);
}
function gameOver(reason) {
  if (G.state === 'over') return;
  G.state = 'over';
  Input.reset();
  const newRec = G.floor > META.best;
  META.best = Math.max(META.best, G.floor);
  META.bestViewers = Math.max(META.bestViewers, Math.round(G.run.maxViewers));
  saveMeta();
  store.del('tg.run');
  const line = reason === 'collapse' ? pick(LINES.collapse) : reason === 'quit' ? LINES.quit : pick(LINES.death);
  G.over = { reason, floor: G.floor, newRec, line };
  if (reason === 'collapse') { Sfx.play('collapse'); G.shake = 12; }
  else if (reason === 'dead') Sfx.play('die');
  setTimeout(showGameOver, reason === 'quit' ? 60 : 1500);
}

// ---------- Beutekisten ----------
function rollBox(tier) {
  const L = P.luck;
  const g = (a, b) => Math.round(randi(a, b) * (1 + 0.25 * (G.floor - 1)));
  const R = {
    potion: (n) => ({ icon: 'potion', t: n > 1 ? n + ' Heiltränke' : 'Heiltrank', s: 'Ab in den Rucksack.', go() { P.potions = Math.min(9, P.potions + n); } }),
    gold: (n) => ({ icon: 'coin', t: n + ' Gold', s: 'Glänzt. Riecht nach Keller.', go() { addGold(n); } }),
    sharp: (n) => ({ icon: 'i_sword', t: 'Schärfstein', s: '+' + n + ' Waffenschaden', go() { P.sharpen += n; } }),
    hp: (n) => ({ icon: 'heart', t: 'Kraftriegel', s: '+' + n + ' Max-Leben', go() { P.maxHp += n; P.hp += n; } }),
    time: (n) => ({ icon: 'i_glass', t: 'Zeitkapsel', s: '+' + n + ' Sekunden', go() { if (G.state === 'shop') P.nextTime += n; else G.timeLeft += n; } }),
    weapon: (k) => {
      const wi = Math.min(WEAPONS.length - 1, P.weapon + k);
      if (wi <= P.weapon) return R.sharp(3);
      const w = WEAPONS[wi];
      return { icon: 'w' + wi, t: w.name, s: w.desc, weapon: true, go() { if (wi > P.weapon) P.weapon = wi; } };
    },
    perk: () => ({ icon: 'i_star', t: 'Perk nach Wahl', s: 'Gleich darfst du wählen.', go() { G.perkQueue.push('box'); } }),
    junk: () => { const j = pick(JUNK); return { icon: 'i_sock', t: j.name, s: j.text + ' Verkauft für 2 Gold.', junk: true, go() { addGold(2); } }; },
  };
  const out = [];
  if (tier === 0) {
    const r = Math.random() + L * 0.08;
    out.push(r < 0.2 ? R.junk() : r < 0.5 ? R.potion(1) : r < 0.8 ? R.gold(g(12, 26)) : R.sharp(1));
  } else if (tier === 1) {
    out.push(chance(0.5) ? R.potion(2) : R.gold(g(30, 55)));
    const r = Math.random() + L * 0.08;
    out.push(r < 0.12 ? R.junk() : r < 0.4 ? R.time(25) : r < 0.7 ? R.hp(6) : r < 0.9 ? R.sharp(2) : R.weapon(1));
  } else if (tier === 2) {
    const r = Math.random();
    out.push(r < 0.4 ? R.weapon(1) : r < 0.7 ? R.perk() : r < 0.88 ? R.hp(12) : R.gold(g(80, 130)));
    out.push(R.potion(1));
  } else {
    out.push(R.weapon(2)); out.push(R.perk()); out.push(R.gold(g(150, 220)));
  }
  return out;
}

// ---------- Werbepause (Shop) ----------
function makeOffers() {
  const f = G.floor + 1, sc = (b) => Math.round(b * (1 + 0.12 * (f - 2)));
  const all = [
    { icon: 'potion', t: 'Heiltrank', s: 'Heilt 40 % Leben', p: sc(18), ok: () => P.potions < 9, go() { P.potions++; } },
    { icon: 'potion', t: 'Trank-Dreierpack', s: '3 Heiltränke', p: sc(45), ok: () => P.potions <= 6, go() { P.potions += 3; } },
    { icon: 'heart', t: 'Volle Heilung', s: 'Sofort volles Leben', p: sc(24), ok: () => P.hp < P.maxHp, go() { P.hp = P.maxHp; } },
    { icon: 'i_sword', t: 'Schärfstein', s: '+2 Waffenschaden', p: sc(40), ok: () => true, go() { P.sharpen += 2; } },
    { icon: 'heart', t: 'Kraftriegel', s: '+8 Max-Leben', p: sc(45), ok: () => true, go() { P.maxHp += 8; P.hp += 8; } },
    { icon: 'i_glass', t: 'Zeitkapsel', s: '+30 Sek. auf der nächsten Etage', p: sc(30), ok: () => true, go() { P.nextTime += 30; } },
    { icon: 'box_b', t: 'Bronze-Kiste', s: 'Zufallsbeute', p: sc(28), ok: () => true, go() { P.boxes.push(0); } },
    { icon: 'box_s', t: 'Silber-Kiste', s: 'Bessere Zufallsbeute', p: sc(65), ok: () => true, go() { P.boxes.push(1); } },
  ];
  const list = [all[0]];
  if (P.weapon < WEAPONS.length - 2 && chance(0.65)) {
    const wi = P.weapon + 1, w = WEAPONS[wi];
    list.push({ icon: 'w' + wi, t: w.name, s: w.desc, p: sc(70 + 40 * P.weapon), ok: () => P.weapon < wi, go() { P.weapon = wi; } });
  }
  for (const o of shuffle(all.slice(1))) if (list.length < 4) list.push(o);
  return { sponsor: pick(SPONSORS), list, line: pick(LINES.shop) };
}

// ---------- Speichern ----------
const PKEYS = ['hp', 'maxHp', 'level', 'xp', 'xpNext', 'weapon', 'sharpen', 'potions', 'gold', 'boxes', 'dmgMul', 'speedMul', 'atkMul', 'rangeMul', 'crit', 'lifeOnKill', 'magnet', 'goldMul', 'viewMul', 'timeBonus', 'armor', 'luck', 'perks', 'nextTime'];
function saveRun() {
  if (!P) return;
  const p = {};
  for (const k of PKEYS) p[k] = P[k];
  store.set('tg.run', { v: 1, floor: G.floor, p, viewers: G.viewers, sponsorIdx: G.sponsorIdx, run: G.run, ach: [...G.achieved], seen: [...G.seenTypes] });
}
function loadRun() {
  const s = store.get('tg.run', null);
  if (!s || s.v !== 1 || !s.p) return false;
  P = newPlayer();
  Object.assign(P, s.p);
  G.viewers = G.vShow = s.viewers || 120;
  G.sponsorIdx = s.sponsorIdx || 0;
  G.pendingCrates = 0;
  G.run = s.run;
  G.achieved = new Set(s.ach || []);
  G.seenTypes = new Set(s.seen || []);
  G.perkQueue = [];
  UI.clear();
  startFloor(s.floor);
  return true;
}

// ---------- Darstellung ----------
let cv, ctx, lcv, lctx, mcv, mctx, miniImg = null;
const V = { w: 200, h: 300, sc: 2, cx: 0, cy: 0 };

function setupCanvas() {
  cv = $('#cv'); ctx = cv.getContext('2d');
  lcv = mkCanvas(8, 8); lctx = lcv.getContext('2d');
  mcv = $('#mini'); mctx = mcv.getContext('2d');
  resize();
}
function resize() {
  const cw = window.innerWidth, ch = window.innerHeight;
  const sc = Math.max(1, Math.round(Math.min(cw, ch) / 215));
  V.sc = sc; V.w = Math.ceil(cw / sc); V.h = Math.ceil(ch / sc);
  cv.width = V.w; cv.height = V.h;
  cv.style.width = V.w * sc + 'px'; cv.style.height = V.h * sc + 'px';
  lcv.width = V.w; lcv.height = V.h;
  ctx.imageSmoothingEnabled = false;
}

function blit(img, cx, cy) {
  let sx = cx, sy = cy, sw = V.w, sh = V.h, dx = 0, dy = 0;
  if (sx < 0) { dx = -sx; sw += sx; sx = 0; }
  if (sy < 0) { dy = -sy; sh += sy; sy = 0; }
  if (sx + sw > img.width) sw = img.width - sx;
  if (sy + sh > img.height) sh = img.height - sy;
  if (sw > 0 && sh > 0) ctx.drawImage(img, sx, sy, sw, sh, dx, dy, sw, sh);
}
function drawSpr(name, x, y, flip, white, scale) {
  const s = (white ? SPRW : SPR)[name];
  if (!s) return;
  scale = scale || 1;
  const w = s.width * scale, h = s.height * scale;
  const dx = Math.round(x - w / 2), dy = Math.round(y - h);
  if (flip) { ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(s, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(s, dx, dy, w, h);
}
function shadow(x, y, w, z) {
  w = Math.max(4, Math.round(w * (1 - Math.min(0.5, (z || 0) / 60))));
  const hw = w >> 1;
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.fillRect(x - hw + 1, y - 1, w - 2, 1);
  ctx.fillRect(x - hw, y, w, 1);
  ctx.fillRect(x - hw + 1, y + 1, w - 2, 1);
}
function explAt(x, y) {
  const tx = (x / TS) | 0, ty = (y / TS) | 0;
  return tx >= 0 && ty >= 0 && tx < M.W && ty < M.H && M.explored[ty * M.W + tx];
}

function drawMapLayer(cx, cy) {
  ctx.fillStyle = '#0b0810'; ctx.fillRect(0, 0, V.w, V.h);
  blit(M.canvas, cx, cy);
  const tx0 = Math.max(0, Math.floor(cx / TS)), ty0 = Math.max(0, Math.floor(cy / TS));
  const tx1 = Math.min(M.W - 1, Math.floor((cx + V.w) / TS)), ty1 = Math.min(M.H - 1, Math.floor((cy + V.h) / TS));
  ctx.fillStyle = '#0b0810';
  for (let ty = ty0; ty <= ty1; ty++) {
    let run = -1;
    for (let tx = tx0; tx <= tx1 + 1; tx++) {
      const un = tx <= tx1 && !M.explored[ty * M.W + tx];
      if (un && run < 0) run = tx;
      else if (!un && run >= 0) { ctx.fillRect(run * TS - cx, ty * TS - cy, (tx - run) * TS, TS); run = -1; }
    }
  }
  for (const t of M.torches) {
    if (!M.explored[t.ty * M.W + t.tx]) continue;
    const x = t.x - cx, y = t.y - cy;
    if (x < -16 || y < -16 || x > V.w + 16 || y > V.h + 16) continue;
    ctx.drawImage(((ANIM * 7 + t.ph) | 0) % 2 ? SPR.torch_b : SPR.torch_a, Math.round(x - 8), Math.round(y - 8));
  }
}
function arrowDown(x, y, col) {
  const rows = [[2, 3], [2, 3], [0, 7], [1, 5], [2, 3], [3, 1]];
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = pass ? col : '#140c1c';
    rows.forEach(([o, w], j) => ctx.fillRect(x - 3 + o + (pass ? 0 : 1), y + j + (pass ? 0 : 1), w, 1));
  }
}
function drawStairsFx(cx, cy) {
  const s = M.stairs;
  if (!M.explored[s.ty * M.W + s.tx]) return;
  const x = Math.round(s.x - cx), y = Math.round(s.y - cy);
  if (G.sealed) {
    ctx.fillStyle = '#ff4d5a';
    for (let i = -5; i <= 5; i += 5) ctx.fillRect(x + i - 1, y - 7, 2, 14);
    ctx.fillRect(x - 7, y - 3, 14, 2); ctx.fillRect(x - 7, y + 2, 14, 2);
  } else arrowDown(x, y - 18 + Math.round(Math.sin(ANIM * 5) * 2), '#8be35f');
}
function drawSlash(s, cx, cy) {
  const p = s.t / s.dur, a0 = s.a - s.arc / 2, steps = Math.ceil(s.r * s.arc * 1.2);
  const front = Math.min(1, p * 1.6);
  for (let k = 0; k <= steps; k++) {
    const q = k / steps;
    if (q > front) break;
    const a = a0 + s.arc * q, ca = Math.cos(a), sa = Math.sin(a);
    const fade = 1 - p;
    for (let rr = s.r - 3; rr <= s.r; rr++) {
      ctx.globalAlpha = fade * (rr === s.r ? 1 : 0.55);
      ctx.fillStyle = rr >= s.r - 1 ? '#ffffff' : s.col;
      ctx.fillRect(Math.round(s.x + ca * rr - cx), Math.round(s.y + sa * rr - cy), 1, 1);
    }
  }
  ctx.globalAlpha = 1;
}
function drawChute(x, y) {
  for (let dx = -11; dx <= 11; dx++) {
    const h = Math.round(Math.sqrt(121 - dx * dx) * 0.7);
    ctx.fillStyle = (((dx + 11) / 4) | 0) % 2 ? '#ff4f8b' : '#f6efff';
    ctx.fillRect(x + dx, y - 10 - h, 1, h + 1);
  }
  ctx.fillStyle = '#c2c3d6';
  for (let i = 0; i < 9; i++) {
    ctx.fillRect(Math.round(x - 10 + i * 0.5), y - 9 + i, 1, 1);
    ctx.fillRect(Math.round(x + 10 - i * 0.5), y - 9 + i, 1, 1);
  }
}

function drawPlayer(cx, cy) {
  const x = Math.round(P.x - cx), y = Math.round(P.y - cy) + P.hh + 1;
  shadow(x, y - 1, 10);
  if (G.state === 'over') return;
  if (P.inv > 0 && ((ANIM * 18) | 0) % 2) return;
  const fr = P.moving ? ((P.walkT * 7) | 0) % 2 : 0;
  drawSpr(fr ? 'hero_b' : 'hero_a', x, y - fr, Math.cos(P.face) < 0, false);
}
function enemySprite(e) {
  switch (e.type) {
    case 'rat': return ((e.t * 8) | 0) % 2 ? 'rat_b' : 'rat_a';
    case 'slime': return e.z > 1 ? 'slime_a' : ((e.t * 3) | 0) % 2 ? 'slime_b' : 'slime_a';
    case 'bat': return ((e.t * 10) | 0) % 2 ? 'bat_b' : 'bat_a';
    case 'mush': return e.puff > 0 ? 'mush_b' : 'mush_a';
    case 'skel': return e.dash > 0 || ((e.t * 5) | 0) % 2 ? 'skel_b' : 'skel_a';
    case 'mimic': return e.dormant ? 'chest' : ((e.t * 6) | 0) % 2 ? 'mimic' : 'chest';
    case 'boss': return e.spr + (e.z > 1 ? '_a' : ((e.t * 3) | 0) % 2 ? '_b' : '_a');
  }
  return 'rat_a';
}
function drawEnemy(e, cx, cy) {
  if (!explAt(e.x, e.y)) return;
  const x = Math.round(e.x - cx), y = Math.round(e.y - cy) + e.hh + 1;
  if (x < -40 || x > V.w + 40 || y < -50 || y > V.h + 60) return;
  const boss = e.type === 'boss', sc = boss ? 2 : 1, z = Math.round(e.z || 0);
  shadow(x, y - 1, boss ? 26 : e.type === 'bat' ? 7 : 11, e.z);
  let yy = y - z;
  if (e.dormant && (ANIM + e.seed) % 3.2 < 0.15) yy -= 1;
  const white = e.flash > 0 || (e.wind > 0 && ((ANIM * 16) | 0) % 2);
  drawSpr(enemySprite(e), x, yy, e.face < 0, white, sc);
  if (boss) drawSpr('crown', x, yy - 19, false, false, 2);
  else if (e.hp < e.maxHp && !e.dormant) {
    const w = 12, f = Math.max(0, e.hp / e.maxHp), top = yy - (e.type === 'rat' ? 10 : 17);
    ctx.fillStyle = '#140c1c'; ctx.fillRect(x - 6, top, w, 3);
    ctx.fillStyle = '#e2434b'; ctx.fillRect(x - 5, top + 1, Math.max(1, Math.round((w - 2) * f)), 1);
  }
}
function drawCrate(c, cx, cy) {
  const x = Math.round(c.x - cx), y = Math.round(c.y - cy) + c.hh + 1;
  shadow(x, y - 1, 13, c.z);
  const yy = y - Math.round(c.z);
  if (c.z > 0) drawChute(x, yy - 12);
  drawSpr('crate', x, yy, false, false);
}

function drawLight(cx, cy, title) {
  const dark = title ? 0.6 : Math.min(0.9, 0.8 + G.floor * 0.012);
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, V.w, V.h);
  lctx.fillStyle = 'rgba(8,4,12,' + dark + ')';
  lctx.fillRect(0, 0, V.w, V.h);
  lctx.globalCompositeOperation = 'destination-out';
  const L = (x, y, r, a) => {
    if (x < -r || y < -r || x > V.w + r || y > V.h + r) return;
    const g = lctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,' + a + ')');
    g.addColorStop(0.55, 'rgba(0,0,0,' + a * 0.75 + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  if (P && !title) L(P.x - cx, P.y - 6 - cy, 84 + Math.sin(ANIM * 9) * 1.5, 1);
  for (const t of M.torches) if (title || M.explored[t.ty * M.W + t.tx]) L(t.x - cx, t.y + 6 - cy, 46 + Math.sin(ANIM * 11 + t.ph) * 2, 0.95);
  if (!title) {
    const s = M.stairs;
    if (M.explored[s.ty * M.W + s.tx]) L(s.x - cx, s.y - cy, 30, 0.85);
    for (const c of G.pickups) if (c.kind === 'crate') L(c.x - cx, c.y - c.z - 8 - cy, 24, 0.85);
    for (const s2 of G.shots) L(s2.x - cx, s2.y - cy, 12, 0.7);
  } else L(V.w / 2, V.h * 0.42, Math.max(V.w, V.h) * 0.45, 0.55);
  ctx.drawImage(lcv, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (const t of M.torches) {
    if (!title && !M.explored[t.ty * M.W + t.tx]) continue;
    const x = t.x - cx, y = t.y + 4 - cy;
    if (x < -40 || y < -40 || x > V.w + 40 || y > V.h + 40) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 40);
    g.addColorStop(0, 'rgba(255,140,60,.16)'); g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 40, y - 40, 80, 80);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function renderGame(dt) {
  const vw = V.w, vh = V.h;
  const tx = P.x - vw / 2, ty = P.y - vh * (vh > vw ? 0.47 : 0.5);
  const k = Math.min(1, dt * 7);
  V.cx += (tx - V.cx) * k; V.cy += (ty - V.cy) * k;
  const mw = M.W * TS, mh = M.H * TS;
  V.cx = mw > vw ? clamp(V.cx, -8, mw - vw + 8) : (mw - vw) / 2;
  V.cy = mh > vh ? clamp(V.cy, -60, mh - vh + 80) : (mh - vh) / 2;
  let sx = 0, sy = 0;
  if (G.shake > 0) { const s = G.shake * (REDUCED ? 0.3 : 1); sx = rand(-s, s); sy = rand(-s, s); }
  const cx = Math.round(V.cx + sx), cy = Math.round(V.cy + sy);
  drawMapLayer(cx, cy);
  drawStairsFx(cx, cy);
  for (const c of M.chests) {
    if (!M.explored[c.ty * M.W + c.tx]) continue;
    ctx.drawImage(c.open ? SPR.chest_open : SPR.chest, c.tx * TS - cx, c.ty * TS - cy);
  }
  for (const c of G.pickups) {
    if (c.kind === 'crate') continue;
    const x = Math.round(c.x - cx), y = Math.round(c.y - cy);
    if (x < -10 || y < -10 || x > vw + 10 || y > vh + 10) continue;
    shadow(x, y + 2, c.kind === 'coin' ? 5 : 8, c.z);
    if (c.kind === 'coin') ctx.drawImage(SPR.coin, x - 4, y - 5 - Math.round(c.z));
    else drawSpr('potion', x, y + 3 - Math.round(c.z), false, false);
  }
  const actors = G.enemies.filter((e) => !e.dead);
  actors.push(P);
  for (const c of G.pickups) if (c.kind === 'crate') actors.push(c);
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a === P) drawPlayer(cx, cy);
    else if (a.kind === 'crate') drawCrate(a, cx, cy);
    else drawEnemy(a, cx, cy);
  }
  for (const e of G.enemies) {
    if (e.type !== 'boss' || e.jump <= 0) continue;
    const x = Math.round(e.jx - cx), y = Math.round(e.jy - cy) + 4, rad = 40;
    ctx.globalAlpha = 0.35 + 0.35 * Math.abs(Math.sin(ANIM * 14));
    ctx.fillStyle = '#ff4d5a';
    for (let i = 0; i < 64; i++) { const a = (i / 64) * TAU; ctx.fillRect(Math.round(x + Math.cos(a) * rad), Math.round(y + Math.sin(a) * rad * 0.6), 1, 1); }
    ctx.globalAlpha = 1;
  }
  for (const s of G.shots) {
    const x = Math.round(s.x - cx), y = Math.round(s.y - cy);
    ctx.fillStyle = '#140c1c'; ctx.fillRect(x - 2, y - 2, 5, 5);
    ctx.fillStyle = '#c8e05a'; ctx.fillRect(x - 1, y - 1, 3, 3);
    ctx.fillStyle = '#f4ffc0'; ctx.fillRect(x, y - 1, 1, 1);
  }
  for (const s of G.slashes) drawSlash(s, cx, cy);
  for (const r of G.rings) {
    const p = r.t / r.dur, rad = r.max * p, n = Math.ceil(rad * 4);
    ctx.globalAlpha = 1 - p; ctx.fillStyle = '#f6efff';
    for (let i = 0; i < n; i++) { const a = (i / n) * TAU; ctx.fillRect(Math.round(r.x + Math.cos(a) * rad - cx), Math.round(r.y + Math.sin(a) * rad * 0.6 - cy), 1, 1); }
    ctx.globalAlpha = 1;
  }
  for (const p of G.parts) {
    ctx.globalAlpha = Math.min(1, 2 * (1 - p.t / p.dur));
    ctx.fillStyle = p.col;
    ctx.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  drawLight(cx, cy, false);
  // leuchtende Augen im Dunkeln
  for (const e of G.enemies) {
    if (!e.aggro || e.dormant || e.dead) continue;
    if (Math.hypot(e.x - P.x, e.y - P.y) < 70 || !explAt(e.x, e.y)) continue;
    const x = Math.round(e.x - cx), y = Math.round(e.y - cy) - (e.type === 'boss' ? 16 : 7) - Math.round(e.z || 0);
    ctx.fillStyle = '#ff4d5a';
    ctx.fillRect(x - 2, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1);
  }
  for (const f of G.floaters) {
    const p = f.t / f.dur;
    ctx.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
    drawText(ctx, f.text, f.x - cx, f.y - cy - p * 16, f.col, f.sc);
  }
  ctx.globalAlpha = 1;
  // Pfeil zur Treppe, wenn sie schon entdeckt, aber außer Sicht ist
  const s = M.stairs;
  if (M.explored[s.ty * M.W + s.tx] && !G.sealed) {
    const x = s.x - cx, y = s.y - cy, m = 14;
    const top = Math.round(88 / V.sc), bot = vh - Math.round(150 / V.sc);
    if (x < m || x > vw - m || y < top || y > bot) {
      const ox = vw / 2, oy = vh * 0.47, a = Math.atan2(y - oy, x - ox);
      const ex = clamp(ox + Math.cos(a) * vw, m, vw - m), ey = clamp(oy + Math.sin(a) * vh, top, bot);
      ctx.save(); ctx.translate(Math.round(ex), Math.round(ey)); ctx.rotate(a);
      ctx.fillStyle = '#140c1c'; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8be35f'; ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,40,60,' + G.flash * 0.45 + ')'; ctx.fillRect(0, 0, vw, vh); }
  if (G.state === 'play' && G.timeLeft < 30) {
    const a = 0.12 + Math.sin(ANIM * (G.timeLeft < 10 ? 12 : 6)) * 0.08;
    ctx.fillStyle = 'rgba(255,30,50,' + a + ')';
    ctx.fillRect(0, 0, vw, 4); ctx.fillRect(0, vh - 4, vw, 4); ctx.fillRect(0, 0, 4, vh); ctx.fillRect(vw - 4, 0, 4, vh);
  }
}

function renderTitle() {
  const t = ANIM * 0.08, mw = M.W * TS, mh = M.H * TS;
  V.cx = mw / 2 - V.w / 2 + Math.cos(t) * mw * 0.28;
  V.cy = mh / 2 - V.h / 2 + Math.sin(t * 1.3) * mh * 0.22;
  const cx = Math.round(V.cx), cy = Math.round(V.cy);
  drawMapLayer(cx, cy);
  drawLight(cx, cy, true);
}

function drawMini() {
  if (!M || G.state === 'title') return;
  if (mcv.width !== M.W || mcv.height !== M.H || !miniImg) {
    mcv.width = M.W; mcv.height = M.H;
    miniImg = mctx.createImageData(M.W, M.H);
    mcv.style.height = Math.round((80 * M.H) / M.W) + 'px';
    M.dirty = true;
  }
  if (M.dirty) {
    const d = miniImg.data;
    for (let i = 0; i < M.W * M.H; i++) {
      const o = i * 4;
      if (!M.explored[i]) { d[o + 3] = 0; continue; }
      if (M.tiles[i] === T_FLOOR) { d[o] = 96; d[o + 1] = 80; d[o + 2] = 110; } else { d[o] = 44; d[o + 1] = 34; d[o + 2] = 54; }
      d[o + 3] = 255;
    }
    M.dirty = false;
  }
  mctx.putImageData(miniImg, 0, 0);
  const s = M.stairs;
  if (M.explored[s.ty * M.W + s.tx]) { mctx.fillStyle = G.sealed ? '#ff4d5a' : '#8be35f'; mctx.fillRect(s.tx - 1, s.ty - 1, 3, 3); }
  mctx.fillStyle = '#ffd23f';
  for (const c of M.chests) if (!c.open && M.explored[c.ty * M.W + c.tx]) mctx.fillRect(c.tx, c.ty, 1, 1);
  for (const c of G.pickups) if (c.kind === 'crate') mctx.fillRect((c.x / TS) | 0, (c.y / TS) | 0, 2, 2);
  if (P && ((ANIM * 3) | 0) % 2 === 0) { mctx.fillStyle = '#ffffff'; mctx.fillRect(((P.x / TS) | 0) - 1, ((P.y / TS) | 0) - 1, 2, 2); }
}

// ---------- ZYNIKA (Ansagen) ----------
const Zyn = {
  q: [], cur: null, shown: 0, hold: 0, lastAmb: -99, talk: 0, el: null, txt: null, face: null, faceState: '',
  say(text, prio) {
    if (!text) return;
    prio = prio == null ? 1 : prio;
    if (prio === 0) {
      if (this.cur || this.q.length || ANIM - this.lastAmb < 9) return;
      this.lastAmb = ANIM;
    }
    if (prio >= 2) { this.q.unshift(text); this.cur = null; Voice.stop(); }
    else this.q.push(text);
    if (this.q.length > 3) this.q.length = 3;
  },
  setFace(f) { if (this.faceState !== f) { this.faceState = f; this.face.src = sprURL(f); } },
  hide() { this.el.classList.add('off'); },
  clear() { this.q = []; this.cur = null; this.hide(); Voice.stop(); },
  update(dt) {

      this.txt.textContent = '';

    }
    this.el.classList.remove('off');
    if (this.shown < this.cur.length) {
      this.shown = Math.min(this.cur.length, this.shown + dt * 48);
      this.txt.textContent = this.cur.slice(0, this.shown | 0);
      this.talk += dt;
      this.setFace(((this.talk * 9) | 0) % 2 ? 'zyn_b' : 'zyn_a');
    } else {
      this.setFace('zyn_a');

  },

const joy = { id: null, ox: 0, oy: 0 };
const atkIds = new Set();
const Input = {
  mx: 0, my: 0, keys: {}, atkTouch: false,
  get attack() { return this.atkTouch || !!this.keys.Space || !!this.keys.KeyJ || !!this.keys.KeyK; },
  vec() {
    const k = this.keys;
    const kx = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
    const ky = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); return { x: kx / l, y: ky / l }; }
    return { x: this.mx, y: this.my };
  },
  reset() {
    this.mx = this.my = 0; this.atkTouch = false; this.keys = {};
    joy.id = null; atkIds.clear();
    stickHome();
    const a = $('#atk'); if (a) a.classList.remove('on');
  },
};
function stickHome() {
  const s = $('#stick');
  if (!s) return;
  s.classList.remove('on');
  s.style.left = ''; s.style.top = ''; s.style.bottom = '';
  $('#knob').style.transform = '';
}
function setupInput() {
  const pad = $('#pad'), stick = $('#stick'), knob = $('#knob'), atk = $('#atk');
  const R = 46;
  pad.addEventListener('pointerdown', (e) => {
    if (G.state !== 'play') return;
    e.preventDefault();
    Sfx.init(); Voice.unlock();
    if (e.clientX < window.innerWidth * 0.5) {
      if (joy.id !== null) return;
      joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY;
      stick.classList.add('on');
      stick.style.left = joy.ox + 'px'; stick.style.top = joy.oy + 'px'; stick.style.bottom = 'auto';
      knob.style.transform = '';
    } else {
      atkIds.add(e.pointerId);
      Input.atkTouch = true;
      atk.classList.add('on');
    }
    try { pad.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
  });
  pad.addEventListener('pointermove', (e) => {
    if (e.pointerId !== joy.id) return;
    e.preventDefault();
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    let l = Math.hypot(dx, dy);
    if (l > R * 1.25) {
      const pull = l - R * 1.25;
      joy.ox += (dx / l) * pull; joy.oy += (dy / l) * pull;
      stick.style.left = joy.ox + 'px'; stick.style.top = joy.oy + 'px';
      dx = e.clientX - joy.ox; dy = e.clientY - joy.oy; l = Math.hypot(dx, dy);
    }
    const kl = Math.min(l, R), ux = l ? dx / l : 0, uy = l ? dy / l : 0;
    knob.style.transform = 'translate(' + (ux * kl).toFixed(1) + 'px,' + (uy * kl).toFixed(1) + 'px)';
    const m = Math.min(1, l / R);
    if (m < 0.18) { Input.mx = 0; Input.my = 0; } else { Input.mx = ux * m; Input.my = uy * m; }
  });
  const end = (e) => {
    if (e.pointerId === joy.id) { joy.id = null; Input.mx = 0; Input.my = 0; stickHome(); }
    if (atkIds.delete(e.pointerId) && atkIds.size === 0) { Input.atkTouch = false; atk.classList.remove('on'); }
  };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
  const btn = (id, fn) => $(id).addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); Sfx.init(); fn(); });
  btn('#btnPot', drinkPotion);
  btn('#btnBox', () => { if (G.state === 'play' && P.boxes.length) showBox('play'); });
  btn('#btnPause', () => { if (G.state === 'play') showPause(); });
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter') && G.state !== 'play') return;
    Input.keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (G.state === 'play') {
      if (e.code === 'KeyE') drinkPotion();
      if (e.code === 'KeyQ' && P.boxes.length) showBox('play');
      if (e.code === 'KeyP' || e.code === 'Escape') showPause();
    } else if (G.state === 'modal' && (e.code === 'KeyP' || e.code === 'Escape') && $('#scr [data-a="resume"]')) resumeTo('play');
    Sfx.init();
  });
  window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; });
  window.addEventListener('blur', () => { Input.reset(); if (G.state === 'play') showPause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') showPause(); });
  $('#scr').addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    if (performance.now() - UI.openedAt < 280) return;
    Sfx.init(); Voice.unlock(); Sfx.play('click');
    const f = ACT[b.dataset.a];
    if (f) f(b.dataset.v);
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
}

// ---------- Hauptschleife ----------
let lastTs = 0;
function frame(ts) {
  let dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  ANIM += dt;
  try {
    if (G.state === 'play') step(dt);
    else if (G.state === 'trans' || G.state === 'over') stepFx(dt);
    if (G.state === 'title') renderTitle();
    else if (M && P) renderGame(dt);
    if (G.state === 'play' || G.state === 'trans' || G.state === 'over') Zyn.update(dt); else Zyn.hide();
    Sfx.setMusic(G.state === 'play' || G.state === 'modal' || G.state === 'shop' || G.state === 'trans', G.state === 'play' && G.timeLeft < 30);
    hudUpdate(dt);
    toastUpdate(dt);
    drawMini();
  } catch (err) {
    console.error(err);
  }
  requestAnimationFrame(frame);
}
function boot() {
  buildArt();
  $('#icHeart').src = sprURL('heart');
  $('#icGlass').src = sprURL('i_glass');
  $('#icEye').src = sprURL('i_eye');
  $('#icCoin').src = sprURL('coin');
  $('#potIcon').src = sprURL('potion');
  $('#boxIcon').src = sprURL('box_g');
  Zyn.el = $('#zyn'); Zyn.txt = $('#zynTxt'); Zyn.face = $('#zynFace');
  Zyn.setFace('zyn_a');
  setupCanvas();
  setupInput();
  showTitle();
  requestAnimationFrame(frame);
  window.__TG = { G, get P() { return P; }, get M() { return M; }, startFloor, unlock, giveXP, showBox, showShop, makeOffers, descend, gameOver, step, Input, bfs, los, boxHit, drink: drinkPotion };
}
boot();

})();
</script>
